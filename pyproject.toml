[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "melanoma-classifier"
version = "0.2.0"
description = "Leakage-aware DermaMNIST melanoma-vs-rest evaluation benchmark."
requires-python = "==3.12.*"
dependencies = []

[project.scripts]
melanoma-classifier = "melanoma_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
