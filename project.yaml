id: 6
name: melanoma-classifier
program:
  id: applied-computer-vision
  narrative_fit: Proves that synthetic skin lesion images with handcrafted features (asymmetry, border irregularity, color) can train a reproducible classifier, eliminating dependency on real clinical data for benchmark validation.
  shared_assets:
    - synthetic medical fixture generator (Pillow-based skin lesion renderer)
    - reproducible benchmark JSON schema with AUC/sensitivity/specificity
    - handcrafted feature extraction pipeline for lesion classification
status: benchmarked
claim: classificacao de lesao de pele
stack:
  - python
  - scikit-learn
  - pillow
  - numpy
  - scipy
  - docker
language_profile:
  primary: python-ml
  secondary: []
  reason: Python with scikit-learn is the standard for ML classification benchmarks; Pillow handles synthetic image generation; handcrafted features avoid deep learning complexity.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: applied-computer-vision
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: recorded
  principles:
    coupling_rule: domain types depend only on standard library; feature extraction depends only on numpy/Pillow/scipy; classifier depends on scikit-learn; CLI depends on argparse.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: one synthetic fixture generator, one feature extraction pipeline, one sklearn classifier, one JSON benchmark output prove the claim without GPU or deep learning.
    testability_rule: domain, feature extraction, and classification run with synthetic images; no network, database, or cloud dependency required.
    rejected_overengineering:
      - PyTorch/TIMM deep learning model
      - real clinical image dataset download
      - GPU training
      - model serving API or web interface
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: no cloud dependency; all data is synthetic and local
    config_switch: none
    unsupported_behaviors: []
  database: none
  runtime: Python CLI in a slim Docker image; scikit-learn LogisticRegression with deterministic seed.
  library_policy: scikit-learn for classification and metrics; Pillow for synthetic image generation; numpy/scipy for feature computation; argparse for CLI; no other runtime dependencies.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: PyTorch/TIMM deep learning classifier
      reason: Deep learning adds GPU dependency and training time without improving the benchmark claim; handcrafted features + LogisticRegression are sufficient to prove reproducible lesion classification.
    - option: Real ISIC dataset download
      reason: External datasets introduce reproducibility risk and network dependency; synthetic fixtures are deterministic, local, and prove the pipeline works.
architecture:
  style: pipeline
  reason: Synthetic image generation, feature extraction, classifier training, and evaluation form a natural four-stage pipeline from synthetic input to benchmark output.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: high
    auditability: medium
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: fixture depends only on Pillow/numpy; feature extraction depends on numpy/scipy/Pillow; classifier depends on scikit-learn; CLI depends on argparse; benchmark orchestrates the full pipeline.
  boundaries:
    - fixture owns synthetic lesion image generation with deterministic seed
    - classifier owns feature extraction and model training
    - benchmark owns orchestration, evaluation, and JSON output
    - cli owns command-line interface
  rejected_alternatives:
    - style: hexagonal
      reason: There is no infrastructure or transport boundary to justify ports and adapters; a four-stage pipeline is sufficient.
    - style: microservices
      reason: A single-machine classification pipeline has no deployment boundary worth splitting.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
benchmark:
  primary_metric: auc
  unit: unit
  command: "python -m melanoma_classifier benchmark --n-samples 500 --output benchmarks/results/baseline.json"
  result_path: benchmarks/results/baseline.json
release:
  docker: "docker run --rm melanoma-classifier"
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
