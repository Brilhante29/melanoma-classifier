id: 6
name: melanoma-classifier
program:
  id: applied-computer-vision
  narrative_fit: Adds a real dermatoscopic vertical with official splits, dataset provenance, validation-only threshold selection, and test AUC.
  shared_assets:
    - dataset source and license manifest
    - train-validation-test leakage boundary
    - medical confusion matrix contract
    - benchmark result v2 publication
status: benchmarked
claim: Measures a non-clinical melanoma-vs-rest baseline on the official DermaMNIST v2.1 splits without test-set threshold leakage.
stack:
  - python-3.12.13
  - numpy-2.0.2
  - scipy-1.15.3
  - scikit-learn-1.7.2
  - dermamnist-v2.1
  - docker
language_profile:
  primary: python-ml
  secondary: []
  reason: NumPy and scikit-learn provide a transparent CPU baseline over a standard biomedical vision dataset.
decision_brain:
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: synthetic-oracle-removed
  principles:
    coupling_rule: Dataset loading, feature extraction, model fitting, threshold selection, and test evaluation are separate stages with explicit arrays between them.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: Use one official dataset, one binary question, one transparent baseline, and one fixed evaluation protocol.
    testability_rule: Unit tests use tiny arrays; Docker validates the real archive and full official splits.
    rejected_overengineering: [deep-learning, gpu, api, database, broker, cloud, experiment-tracker]
  stack_profile: python-ml
  api_style: cli
  messaging: none
  cloud:
    mode: none
    local_provider: docker
    real_provider_target: none
    adapter_rule: Dataset is committed and hash-verified; no runtime cloud behavior exists.
  database: none
  runtime: Non-root CPU Docker benchmark with no runtime network.
  library_policy: Use NumPy for vectorized image features and scikit-learn for a class-balanced, interpretable baseline; avoid a deep model until its added cost is a measured question.
  record_path: sdd/technical-decision.md
architecture:
  style: pipeline
  reason: The dominant force is leakage-safe progression from versioned data through training and validation-only threshold selection to untouched test evidence.
  dependency_rule: Test evaluation never participates in model fitting or threshold selection.
  boundaries:
    - dataset archive integrity and split contract
    - vectorized image feature extraction
    - class-balanced model training
    - validation-only threshold selection
    - untouched test evaluation
dataset:
  name: DermaMNIST
  version: v2.1
  source: https://zenodo.org/records/6496656
  license: CC BY-NC 4.0
  sha256: 1a309fec2e33bb6aba88e7d078e5ccbb9736c84a0b415ac197eb3c8fa331e050
  clinical_use: false
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses: [programs, decision-brain, architecture, python-computer-vision, medical-evaluation, design-system, sdd, benchmark-contract, skills]
benchmark:
  primary_metric: auc
  unit: ratio
  command: docker run --rm --network none melanoma-classifier
  result_path: benchmarks/results/baseline.json
  evidence_status: current
release:
  docker: docker run --rm --network none melanoma-classifier
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
